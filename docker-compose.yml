# ============================================================
# Docker Compose — TA Data Analysis Agent
# Services: Open WebUI (Frontend)
# NOTE: Ollama runs natively on host (not as container)
#       to avoid port conflicts with the host service.
# ============================================================

services:
  # -----------------------------------------------------------
  # Open WebUI — Frontend Chat Interface
  # Connects to Ollama running natively on host (port 11434)
  # -----------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
      # Relative to this compose file → portable, no host-specific absolute path
      - ./data/samples:/data/samples
      # Hanan frontend theme (presentation layer only) — OWUI v0.9.6 static slots.
      # NOTE: source custom.js is mounted AS loader.js (v0.9.6 loads custom JS via loader.js).
      - ./frontend-theme/custom.css:/app/backend/open_webui/static/custom.css:ro
      - ./frontend-theme/custom.js:/app/backend/open_webui/static/loader.js:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Point to Ollama running natively on host
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Disable built-in RAG — file analysis handled by FastAPI backend tool
      - ENABLE_RAG=false
      # Default model
      - DEFAULT_MODELS=qwen3:8b
      # File upload limits (in MB)
      - MAX_UPLOAD_SIZE=100

volumes:
  open-webui-data:
    external: true
    # Point to the live data volume (active, Jun 15) instead of the stale "open-webui-data".
    # The running container was created via `docker run` against this volume.
    name: open-webui
